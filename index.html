<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satélite do Imóvel</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#1c2733;--muted:#5d6b78;--line:#d9d4c8;--accent:#17605a;--accent-ink:#fff;--ok:#2c7a3f;--bad:#a32e2e}
@media (prefers-color-scheme:dark){:root{--bg:#12181e;--card:#1a222a;--ink:#e8e4da;--muted:#9aa7b3;--line:#2f3a45;--accent:#4cb3a8;--accent-ink:#0c1a18;--ok:#6cc27e;--bad:#e58080;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
header,footer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;background:var(--card);border-block:1px solid var(--line)}
form{display:flex;gap:8px;flex:1 1 320px;min-width:0}
input{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:inherit}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 14px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
#map{flex:1;min-height:0}
#read{flex:1 1 260px;font:600 16px ui-monospace,Consolas,monospace}
#msg{font-size:13px;color:var(--ok)}
</style>
</head>
<body>
<header>
  <strong>Satélite do imóvel</strong>
  <form id="f"><input id="q" placeholder="Endereço, bairro, cidade ou coordenadas" aria-label="Buscar"><button class="pri" type="submit">Buscar</button></form>
  <button type="button" id="zin" aria-label="Aproximar">+</button><button type="button" id="zout" aria-label="Afastar">−</button>
</header>
<div id="map"></div>
<footer>
  <div id="read">Arraste, aproxime e clique sobre o imóvel.</div>
  <span style="font-size:12px;color:var(--muted);flex:1 1 220px">A imagem do laudo sai centrada no ponto, com a aproximação atual (afaste o mapa para mostrar mais da região).</span>
  <button class="pri" id="send" type="button" disabled>Usar este ponto na ficha</button>
  <span id="msg"></span>
</footer>
<script>
/* Mapa de satélite simples: tiles Web Mercator (Esri World Imagery), arrastar, zoom e clique. */
function SatMap(box,o){
  o=o||{};
  var TILE=256,MINZ=2,MAXZ=19,z=o.z||4,W=0,H=0,mk=null,drag=null,loaded=0,failed=0,fired=false,imgs=Object.create(null);
  var c0=o.center||{lat:-14,lon:-52};
  var LAYERS=["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"];
  if(o.labels!==false)LAYERS.push("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}");
  function ll2w(lat,lon,zz){var s=TILE*Math.pow(2,zz),sn=Math.sin(lat*Math.PI/180);return {x:(lon+180)/360*s,y:(0.5-Math.log((1+sn)/(1-sn))/(4*Math.PI))*s}}
  function w2ll(x,y,zz){var s=TILE*Math.pow(2,zz),n=Math.PI-2*Math.PI*y/s;return {lat:180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))),lon:x/s*360-180}}
  var p0=ll2w(c0.lat,c0.lon,z),cx=p0.x,cy=p0.y;
  box.style.position="relative";box.style.overflow="hidden";box.style.touchAction="none";box.style.cursor="crosshair";box.style.background="#1b2733";
  var mkEl=document.createElement("div");
  mkEl.style.cssText="position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid #ff3b30;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 6px #000;pointer-events:none;z-index:5;display:none";
  var dot=document.createElement("div");dot.style.cssText="position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#ff3b30;border-radius:50%";mkEl.appendChild(dot);box.appendChild(mkEl);
  var at=document.createElement("div");at.textContent="Imagens: Esri, Maxar, Earthstar Geographics";at.style.cssText="position:absolute;right:6px;bottom:4px;font:10px sans-serif;color:#fff;text-shadow:0 0 3px #000;pointer-events:none;z-index:6";box.appendChild(at);
  function fail(){if(!fired&&!loaded){fired=true;if(o.onFail)o.onFail()}}
  var t=setTimeout(fail,7000);
  function clampC(){var s=TILE*Math.pow(2,z);cx=((cx%s)+s)%s;cy=Math.max(0,Math.min(s,cy))}
  function place(){
    if(!mk){mkEl.style.display="none";return}
    var s=TILE*Math.pow(2,z),p=ll2w(mk.lat,mk.lon,z),dx=p.x-cx;
    if(dx>s/2)dx-=s;if(dx<-s/2)dx+=s;
    mkEl.style.left=(W/2+dx)+"px";mkEl.style.top=(H/2+p.y-cy)+"px";mkEl.style.display="block";
  }
  function render(){
    W=box.clientWidth;H=box.clientHeight;if(!W||!H)return;
    clampC();
    var n=Math.pow(2,z),tlx=cx-W/2,tly=cy-H/2,keep={};
    var x0=Math.floor(tlx/TILE),x1=Math.floor((tlx+W)/TILE),y0=Math.max(0,Math.floor(tly/TILE)),y1=Math.min(n-1,Math.floor((tly+H)/TILE));
    for(var L=0;L<LAYERS.length;L++)for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++){
      var wx=((tx%n)+n)%n,key=L+"/"+z+"/"+tx+"/"+ty,im=imgs[key];
      if(!im){
        im=new Image();im.draggable=false;im.alt="";
        im.style.cssText="position:absolute;width:256px;height:256px;max-width:none;user-select:none;pointer-events:none;z-index:"+(L?2:1);
        im.onload=function(){loaded++;if(o.onLoad)o.onLoad()};
        im.onerror=function(){failed++;if(failed>=3)fail()};
        im.src=LAYERS[L].replace("{z}",z).replace("{y}",ty).replace("{x}",wx);
        box.appendChild(im);imgs[key]=im;
      }
      im.style.left=Math.round(tx*TILE-tlx)+"px";im.style.top=Math.round(ty*TILE-tly)+"px";keep[key]=1;
    }
    for(var k in imgs)if(!keep[k]){imgs[k].remove();delete imgs[k]}
    place();
  }
  function zoomAt(px,py,nz){
    nz=Math.max(MINZ,Math.min(MAXZ,nz));if(nz===z)return;
    var r=Math.pow(2,nz-z),wx=cx-W/2+px,wy=cy-H/2+py;
    cx=wx*r-(px-W/2);cy=wy*r-(py-H/2);z=nz;render();
  }
  box.addEventListener("wheel",function(e){e.preventDefault();var r=box.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,z+(e.deltaY<0?1:-1))},{passive:false});
  box.addEventListener("pointerdown",function(e){drag={sx:e.clientX,sy:e.clientY,cx:cx,cy:cy,moved:false};box.setPointerCapture(e.pointerId)});
  box.addEventListener("pointermove",function(e){
    if(!drag)return;var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;
    cx=drag.cx-dx;cy=drag.cy-dy;render();
  });
  box.addEventListener("pointerup",function(e){
    var was=drag;drag=null;if(!was||was.moved)return;
    var r=box.getBoundingClientRect(),ll=w2ll(cx-W/2+e.clientX-r.left,cy-H/2+e.clientY-r.top,z);
    mk=ll;place();if(o.onPick)o.onPick(ll.lat,ll.lon);
  });
  if(window.ResizeObserver)new ResizeObserver(render).observe(box);else window.addEventListener("resize",render);
  render();
  return {
    setView:function(lat,lon,zz){var p=ll2w(lat,lon,zz);z=zz;cx=p.x;cy=p.y;render()},
    zoomBy:function(dz){zoomAt(W/2,H/2,z+dz)},
    setMarker:function(lat,lon){mk={lat:lat,lon:lon};place()},
    getZoom:function(){return z},
    /* imagem da região centrada no ponto, com o marcador do imóvel, para o laudo */
    capture:function(lat,lon,zz,W2,H2){
      var p=ll2w(lat,lon,zz),n=Math.pow(2,zz),tlx=p.x-W2/2,tly=p.y-H2/2,c=document.createElement("canvas");c.width=W2;c.height=H2;
      var g=c.getContext("2d"),jobs=[],ref=["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}","https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"];
      var lays=[LAYERS[0]].concat(ref);
      var x0=Math.floor(tlx/TILE),x1=Math.floor((tlx+W2)/TILE),y0=Math.max(0,Math.floor(tly/TILE)),y1=Math.min(n-1,Math.floor((tly+H2)/TILE));
      lays.forEach(function(url,L){var lj=[];for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++)(function(tx,ty){lj.push(new Promise(function(res){
        var im=new Image();im.crossOrigin="anonymous";im.onload=function(){res({im:im,x:Math.round(tx*TILE-tlx),y:Math.round(ty*TILE-tly)})};im.onerror=function(){res(null)};
        im.src=url.replace("{z}",zz).replace("{y}",ty).replace("{x}",((tx%n)+n)%n)}))})(tx,ty);jobs.push(Promise.all(lj))});
      return Promise.all(jobs).then(function(camadas){
        if(!camadas[0].some(Boolean))throw new Error("imagens não carregaram");
        camadas.forEach(function(cs){cs.forEach(function(t){if(t)g.drawImage(t.im,t.x,t.y)})});
        /* marcador: alfinete vermelho com borda branca, ponta no imóvel */
        var cx=W2/2,cy=H2/2,R=Math.round(W2/50);
        g.save();g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=R*0.6;g.shadowOffsetY=R*0.15;
        g.beginPath();g.moveTo(cx,cy);g.bezierCurveTo(cx-R*0.35,cy-R*1.1,cx-R*1.05,cy-R*1.55,cx-R*1.05,cy-R*2.3);g.arc(cx,cy-R*2.3,R*1.05,Math.PI,0);g.bezierCurveTo(cx+R*1.05,cy-R*1.55,cx+R*0.35,cy-R*1.1,cx,cy);g.closePath();
        g.fillStyle="#e53935";g.fill();g.restore();g.lineWidth=Math.max(2,R*0.18);g.strokeStyle="#fff";g.stroke();
        g.beginPath();g.arc(cx,cy-R*2.3,R*0.42,0,7);g.fillStyle="#fff";g.fill();
        var fs=Math.round(W2/80);g.font=fs+"px sans-serif";g.textAlign="right";g.textBaseline="bottom";g.lineWidth=3;g.strokeStyle="rgba(0,0,0,.6)";
        var at="Imagens: Esri, Maxar, Earthstar Geographics";g.strokeText(at,W2-8,H2-6);g.fillStyle="#fff";g.fillText(at,W2-8,H2-6);
        return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error("falha ao gerar a imagem"))},"image/jpeg",.88)});
      });
    },
    destroy:function(){clearTimeout(t)}
  };
}

(function(){
var $=function(s){return document.querySelector(s)};
function parseCoord(s){var q=String(s||"").match(/(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)/);if(!q)return null;var la=+q[1],lo=+q[2];return Math.abs(la)<=90&&Math.abs(lo)<=180?{lat:la,lon:lo}:null}
var pick=null;
function say(t,bad){$("#msg").style.color=bad?"var(--bad)":"";$("#msg").textContent=t}
var map=SatMap($("#map"),{z:4,center:{lat:-14,lon:-52},
  onPick:function(a,b){pick={lat:a,lon:b};$("#read").textContent="Latitude "+a.toFixed(5)+"   Longitude "+b.toFixed(5);$("#send").disabled=false;say("")},
  onFail:function(){say("As imagens não carregaram. Confira a internet.",true)}});
$("#zin").addEventListener("click",function(){map.zoomBy(1)});
$("#zout").addEventListener("click",function(){map.zoomBy(-1)});
$("#send").addEventListener("click",function(){
  if(!pick)return;
  var txt=pick.lat.toFixed(5)+", "+pick.lon.toFixed(5);
  if(window.opener){
    var zc=Math.max(16,Math.min(18,map.getZoom())),p=pick;
    $("#send").disabled=true;say("Preparando a imagem da região para o laudo...");
    map.capture(p.lat,p.lon,zc,1400,860).catch(function(){return null}).then(function(img){
      try{window.opener.postMessage({type:"ficha-coord",lat:p.lat,lon:p.lon,img:img||null},"*");say(img?"Enviado para a ficha, com a imagem da região.":"Coordenada enviada. A imagem da região não carregou.");setTimeout(function(){window.close()},img?700:2500)}
      catch(e){$("#send").disabled=false;say("Não consegui enviar para a ficha. Tente de novo.",true)}
    });
    return;
  }
  function manual(){say("Copie "+txt+" e cole na ficha com Ctrl+V.",true)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){say("Copiado. Volte para a ficha e aperte Ctrl+V.")},manual);else manual();
});
function go(q){
  q=String(q||"").trim();if(!q)return;
  var p=parseCoord(q);if(p){map.setView(p.lat,p.lon,18);map.setMarker(p.lat,p.lon);return}
  say("Procurando...");
  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q="+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(a){
    if(!a.length){say("Endereço não encontrado. Tente só bairro e cidade.",true);return}
    map.setView(+a[0].lat,+a[0].lon,17);say("");
  }).catch(function(){say("A busca falhou. Arraste o mapa até o local.",true)});
}
$("#f").addEventListener("submit",function(e){e.preventDefault();go($("#q").value)});
var h=decodeURIComponent(location.hash.slice(1)||"");
if(h){var p=parseCoord(h);if(p){map.setView(p.lat,p.lon,18);map.setMarker(p.lat,p.lon);pick=p;$("#read").textContent="Latitude "+p.lat.toFixed(5)+"   Longitude "+p.lon.toFixed(5);$("#send").disabled=false}else{$("#q").value=h;go(h)}}
})();
</script>
</body>
</html>
